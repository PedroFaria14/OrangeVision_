openapi: 3.1.0
info:
  title: OrangeVision Online API
  description: API online separada do Raspberry. Datas com offset, início inclusivo
    e fim exclusivo. Usuários novos não têm dispositivos. Histórico append-only e
    limitado a 100 itens por página. Campos métricos ausentes permanecem null. Razões
    0–1; score experimental 0–100. Sem snapshot comum entre endpoints; as_of é horário
    da consulta.
  version: 2.0.0
