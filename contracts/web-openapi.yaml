components:
  schemas:
    Analysis:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        device_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Device Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        classification:
          type: string
          enum:
          - APROVADA
          - ATENCAO
          - REVISAR
          title: Classification
        metrics:
          $ref: '#/components/schemas/Metrics'
        calibration_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Calibration Version
        image_url:
          type: 'null'
          title: Image Url
        lot:
          type: 'null'
          title: Lot
        synced_at:
          type: 'null'
          title: Synced At
        inspection_session_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Inspection Session Id
        classification_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Classification Reason
      type: object
      required:
      - id
      - device_id
      - timestamp
      - classification
      - metrics
      - calibration_version
      title: Analysis
    AnalysisPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Analysis'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        as_of:
          type: string
          format: date-time
          title: As Of
      type: object
      required:
      - items
      - total
      - as_of
      title: AnalysisPage
    AuthorizePhotoReview:
      properties:
        original_inspection_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Original Inspection Id
        review_inspection_id:
          type: string
          format: uuid
          title: Review Inspection Id
      additionalProperties: false
      type: object
      required:
      - review_inspection_id
      title: AuthorizePhotoReview
    Bucket:
      properties:
        start:
          type: string
          format: date-time
          title: Start
        approved:
          type: integer
          title: Approved
        attention:
          type: integer
          title: Attention
        review:
          type: integer
          title: Review
      type: object
      required:
      - start
      - approved
      - attention
      - review
      title: Bucket
    ClaimSample:
      properties:
        claim_id:
          type: string
          format: uuid
          title: Claim Id
        lease_token:
          type: string
          maxLength: 128
          minLength: 32
          format: password
          title: Lease Token
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - claim_id
      - lease_token
      title: ClaimSample
    CountChange:
      properties:
        absolute:
          type: integer
          title: Absolute
        percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Percent
      type: object
      required:
      - absolute
      - percent
      title: CountChange
    Credentials:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 12
          format: password
          title: Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - email
      - password
      title: Credentials
    Detection:
      properties:
        status:
          type: string
